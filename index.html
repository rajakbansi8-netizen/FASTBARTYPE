
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FASTBARTYPE - Typing Test</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#080b12;
  --box:#111827;
  --text:#fff;
  --muted:#9ca3af;
  --green:#00ffab;
  --border:#263044;
}

body.light{
  --bg:#f3f5f9;
  --box:#fff;
  --text:#111827;
  --muted:#64748b;
  --border:#dce2ec;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px 6%;
  border-bottom:1px solid var(--border);
}

.logo{
  font-size:25px;
  font-weight:bold;
  color:var(--green);
}

.logo span{color:var(--text)}

button,select{
  cursor:pointer;
  border:0;
  border-radius:10px;
  padding:13px;
  font-weight:bold;
}

#theme{
  background:var(--box);
  color:var(--text);
  border:1px solid var(--border);
}

main{
  max-width:850px;
  margin:35px auto;
  padding:15px;
}

.hero{
  text-align:center;
  margin-bottom:30px;
}

.hero h1{font-size:34px}
.hero h1 span{color:var(--green)}
.hero p{color:var(--muted);margin-top:12px}

.box{
  background:var(--box);
  border:1px solid var(--border);
  border-radius:18px;
  padding:22px;
}

.settings{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-bottom:22px;
}

label{
  color:var(--muted);
  font-size:13px;
}

select{
  width:100%;
  margin-top:8px;
  background:var(--bg);
  color:var(--text);
  border:1px solid var(--border);
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-bottom:22px;
}

.stat{
  background:var(--bg);
  padding:15px 5px;
  text-align:center;
  border-radius:12px;
}

.stat h2{
  color:var(--green);
  font-size:25px;
}

.stat p{
  color:var(--muted);
  font-size:11px;
  margin-top:6px;
}

#passage{
  font-size:20px;
  line-height:2;
  color:var(--muted);
  margin-bottom:20px;
  overflow-wrap:anywhere;
}

.correct{color:var(--green)}
.wrong{color:#ff5268;background:#51202b}
.active{border-bottom:2px solid var(--green)}

textarea{
  width:100%;
  height:120px;
  resize:vertical;
  background:var(--bg);
  color:var(--text);
  border:1px solid var(--border);
  border-radius:12px;
  padding:15px;
  font-size:18px;
  line-height:1.6;
  outline:none;
}

textarea:focus{border-color:var(--green)}

.buttons{
  display:flex;
  gap:10px;
  margin-top:15px;
}

#start{
  background:var(--green);
  color:#07120b;
  flex:1;
}

#reset{
  background:var(--border);
  color:var(--text);
}

#result{
  text-align:center;
  color:var(--green);
  margin-top:20px;
  font-size:18px;
  line-height:1.6;
}

footer{
  text-align:center;
  color:var(--muted);
  padding:25px;
}

@media(max-width:600px){
  main{margin:20px auto}
  .hero h1{font-size:28px}
  .box{padding:15px}
  #passage{font-size:18px}
  .stats{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>

<body>

<header>
  <div class="logo">FAST<span>BARTYPE</span></div>
  <button id="theme">☀️ Light</button>
</header>

<main>

<section class="hero">
  <h1>Typing <span>Speed Test</span></h1>
  <p>Practice every day. Improve your speed.</p>
</section>

<section class="box">

<div class="settings">
  <label>
    Language
    <select id="language">
      <option value="en">English Typing</option>
      <option value="hi">Hindi Typing</option>
    </select>
  </label>

  <label>
    Test Time
    <select id="duration">
      <option value="30">30 Seconds</option>
      <option value="60" selected>1 Minute</option>
      <option value="120">2 Minutes</option>
    </select>
  </label>
</div>

<div class="stats">
  <div class="stat">
    <h2 id="timer">60</h2>
    <p>SECONDS</p>
  </div>

  <div class="stat">
    <h2 id="wpm">0</h2>
    <p>WPM</p>
  </div>

  <div class="stat">
    <h2 id="accuracy">100%</h2>
    <p>ACCURACY</p>
  </div>

  <div class="stat">
    <h2 id="best">0</h2>
    <p>BEST WPM</p>
  </div>
</div>

<div id="passage"></div>

<textarea id="typing" disabled
placeholder="Start test and type here..."></textarea>

<div class="buttons">
  <button id="start">START TEST</button>
  <button id="reset">RESET</button>
</div>

<div id="result"></div>

</section>
</main>

<footer>© 2026 FASTBARTYPE</footer>

<script>
const englishText =
"Practice every day to improve your typing speed and accuracy. Keep your fingers relaxed and focus on typing each word correctly. Learning a new skill takes time. Stay consistent and keep improving with FASTBARTYPE.";

const hindiText =
"नियमित अभ्यास से आपकी टाइपिंग की गति और सटीकता बेहतर होती है। धीरे धीरे अभ्यास करें और हर शब्द को सही लिखने की कोशिश करें। मेहनत और निरंतर अभ्यास से आप एक अच्छे टाइपिस्ट बन सकते हैं।";

const passage = document.getElementById("passage");
const typing = document.getElementById("typing");
const timer = document.getElementById("timer");
const wpm = document.getElementById("wpm");
const accuracy = document.getElementById("accuracy");
const best = document.getElementById("best");
const start = document.getElementById("start");
const reset = document.getElementById("reset");
const language = document.getElementById("language");
const duration = document.getElementById("duration");
const theme = document.getElementById("theme");
const result = document.getElementById("result");

let text = englishText;
let timeLeft = 60;
let running = false;
let interval = null;
let startTime = null;

function getBest(){
  try{
    return Number(localStorage.getItem("fastbartype-best") || 0);
  }catch{
    return 0;
  }
}

function saveBest(score){
  try{
    localStorage.setItem("fastbartype-best",score);
  }catch{}
}

best.textContent = getBest();

function renderText(){
  passage.innerHTML = "";

  text.split("").forEach((char,index)=>{
    const span = document.createElement("span");
    span.textContent = char;

    if(index === 0) span.className = "active";

    passage.appendChild(span);
  });
}

function updateStats(){
  const value = typing.value;
  const spans = passage.querySelectorAll("span");

  let correct = 0;

  spans.forEach((span,index)=>{
    span.className = "";

    if(index < value.length){
      if(value[index] === text[index]){
        span.className = "correct";
        correct++;
      }else{
        span.className = "wrong";
      }
    }else if(index === value.length){
      span.className = "active";
    }
  });

  const elapsed = Math.max(
    (Date.now()-startTime)/1000,1
  );

  const speed = Math.round(
    (correct/5)/(elapsed/60)
  );

  const accuracyValue = value.length
    ? Math.round(correct/value.length*100)
    : 100;

  wpm.textContent = speed;
  accuracy.textContent = accuracyValue+"%";
}

function startTest(){
  if(running) return;

  running = true;
  startTime = Date.now();

  typing.disabled = false;
  typing.value = "";
  typing.focus();

  start.textContent = "TEST RUNNING";
  result.textContent = "";

  interval = setInterval(()=>{
    const elapsed = Math.floor(
      (Date.now()-startTime)/1000
    );

    timeLeft = Math.max(
      Number(duration.value)-elapsed,0
    );

    timer.textContent = timeLeft;
    updateStats();

    if(timeLeft <= 0){
      finishTest();
    }
  },200);
}

function finishTest(){
  clearInterval(interval);
  running = false;
  typing.disabled = true;

  start.textContent = "START AGAIN";

  const score = Number(wpm.textContent);
  const oldBest = getBest();

  if(score > oldBest){
    saveBest(score);
    best.textContent = score;
  }

  result.textContent =
    "Test Complete! Speed: "+score+
    " WPM | Accuracy: "+accuracy.textContent;
}

function resetTest(){
  clearInterval(interval);

  running = false;
  startTime = null;

  timeLeft = Number(duration.value);
  timer.textContent = timeLeft;

  wpm.textContent = "0";
  accuracy.textContent = "100%";

  typing.value = "";
  typing.disabled = true;

  start.textContent = "START TEST";
  result.textContent = "";

  renderText();
}

language.addEventListener("change",()=>{
  text = language.value === "hi"
    ? hindiText
    : englishText;

  resetTest();
});

duration.addEventListener("change",resetTest);

start.addEventListener("click",startTest);
reset.addEventListener("click",resetTest);

typing.addEventListener("input",updateStats);

theme.addEventListener("click",()=>{
  document.body.classList.toggle("light");

  theme.textContent =
    document.body.classList.contains("light")
      ? "🌙 Dark"
      : "☀️ Light";
});

timer.textContent = duration.value;

renderText();
</script>

<button id="shareResult">📤 Share Result</button>
  
</body>
</html>
